<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Konnector Tech — Coming Soon</title>
<meta name="description" content="We help organisations implement smarter systems, manage complex projects, and navigate technology with confidence.">
<meta name="theme-color" content="#0A0F1E">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=Exo+2:wght@600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A0F1E;
    --glow: rgba(14, 116, 160, 0.22);
    --line: rgba(56, 120, 170, 0.18);
    --node: rgba(56, 140, 200, 0.45);
    --text: #F5F7FA;
    --muted: #8A97B0;
    --faint: #5B6780;
    --accent: #00C2FF;
    --accent-hover: #33CEFF;
    --input-bg: #111827;
    --input-border: #263043;
    --ok: #34D399;
    --err: #F87171;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  .bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  .bg svg { width: 100%; height: 100%; }
  .bg::after {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(ellipse 45% 40% at 50% 38%, var(--glow), transparent 70%);
  }
  main {
    position: relative; z-index: 1;
    min-height: 100vh; min-height: 100dvh;
    display: flex; flex-direction: column; align-items: center;
    padding: 40px 16px 24px; text-align: center;
  }
  .content { flex: 1; display: flex; flex-direction: column; align-items: center; max-width: 820px; width: 100%; }
  .brand { display: flex; align-items: center; gap: 14px; color: #fff; text-decoration: none; }
  .brand svg { width: 70px; height: 62px; flex-shrink: 0; }
  .brand span { font-family: "Exo 2", Inter, sans-serif; font-weight: 600; font-size: 28px; letter-spacing: -0.2px; }
  .eyebrow {
    margin-top: 36px; color: var(--accent);
    font-size: 14px; font-weight: 600; letter-spacing: 0.32em; text-transform: uppercase;
  }
  h1 {
    margin-top: 28px;
    font-size: clamp(38px, 7vw, 64px); font-weight: 800;
    line-height: 1.08; letter-spacing: -0.035em;
  }
  .lede { margin-top: 24px; max-width: 540px; color: var(--muted); font-size: clamp(16px, 2.2vw, 18px); line-height: 1.55; }
  form { margin-top: 48px; display: flex; gap: 12px; width: 100%; max-width: 448px; }
  input[type=email] {
    flex: 1; min-width: 0; height: 46px; padding: 0 16px;
    background: var(--input-bg); border: 1px solid var(--input-border); border-radius: 8px;
    color: var(--text); font: inherit; font-size: 15px;
    transition: border-color .15s ease-out;
  }
  input[type=email]::placeholder { color: var(--muted); }
  input[type=email]:focus { outline: none; border-color: var(--accent); }
  button {
    height: 46px; padding: 0 24px; border: 0; border-radius: 8px;
    background: var(--accent); color: #fff; font: inherit; font-size: 15px; font-weight: 600;
    cursor: pointer; white-space: nowrap; transition: background .15s ease-out;
  }
  button:hover { background: var(--accent-hover); }
  button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  button:disabled { opacity: .7; cursor: default; }
  .msg { margin-top: 14px; min-height: 20px; font-size: 14px; }
  .msg.ok { color: var(--ok); } .msg.err { color: var(--err); }
  .hp { position: absolute; left: -9999px; }
  footer { color: var(--faint); font-size: 13px; padding-top: 32px; }
  @media (max-width: 480px) {
    form { flex-direction: column; }
    input[type=email] { flex: none; }
    .brand span { font-size: 24px; }
    .brand svg { width: 56px; height: 50px; }
  }
</style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <svg viewBox="0 0 1308 719" preserveAspectRatio="xMidYMid slice">
      <g stroke="var(--line)" stroke-width="1" fill="none">
        <line x1="140" y1="0" x2="140" y2="719"/><line x1="1197" y1="0" x2="1197" y2="719"/>
        <line x1="0" y1="22" x2="1308" y2="22"/><line x1="0" y1="568" x2="1308" y2="568"/>
        <path d="M140 22 L390 230 L390 380 L140 568"/><path d="M1197 22 L947 230 L947 380 L1197 568"/>
        <path d="M140 22 L0 250"/><path d="M1197 22 L1308 250"/>
        <path d="M140 568 L0 340"/><path d="M1197 568 L1308 340"/>
        <path d="M390 230 L947 230" opacity=".5"/><path d="M390 380 L947 380" opacity=".5"/>
      </g>
      <g fill="var(--node)">
        <circle cx="140" cy="22" r="4"/><circle cx="1197" cy="22" r="4"/>
        <circle cx="140" cy="568" r="4"/><circle cx="1197" cy="568" r="4"/>
        <circle cx="390" cy="380" r="3"/><circle cx="947" cy="380" r="3"/>
      </g>
    </svg>
  </div>

  <main>
    <div class="content">
      <a class="brand" href="/" aria-label="Konnector Tech home">
        <svg viewBox="0 0 70 62" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" aria-hidden="true">
          <circle cx="35" cy="9" r="6.5"/>
          <circle cx="10" cy="51" r="6.5"/>
          <circle cx="60" cy="51" r="6.5"/>
          <path d="M31.5 14.5 L13.5 45.5"/>
          <path d="M38.5 14.5 L43 22 L37 33 L56.5 45.5"/>
          <path d="M16.5 51 L28 51 L31 47 L35 51 L53.5 51"/>
        </svg>
        <span>Konnector Tech</span>
      </a>

      <p class="eyebrow">Konnector Tech</p>
      <h1>Something great is coming soon</h1>
      <p class="lede">We help organisations implement smarter systems, manage complex projects, and navigate technology with confidence.</p>

      <form id="notify" novalidate>
        <label for="email" class="hp">Email address</label>
        <input id="email" name="email" type="email" placeholder="Enter your email address" autocomplete="email" required>
        <input class="hp" name="company" tabindex="-1" autocomplete="off" aria-hidden="true">
        <button type="submit">Notify Me</button>
      </form>
      <p class="msg" id="msg" role="status" aria-live="polite"></p>
    </div>
    <footer>© <span id="yr">2026</span> Konnector LLC. All rights reserved.</footer>
  </main>

<script>
  document.getElementById('yr').textContent = new Date().getFullYear();
  const form = document.getElementById('notify'), msg = document.getElementById('msg');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = form.email.value.trim();
    msg.className = 'msg';
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      msg.textContent = 'Please enter a valid email address.'; msg.classList.add('err'); return;
    }
    const btn = form.querySelector('button'); btn.disabled = true; btn.textContent = 'Sending…';
    try {
      const r = await fetch('/api/notify', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, company: form.company.value })
      });
      if (!r.ok) throw new Error();
      form.reset(); msg.textContent = "Thanks! We'll let you know when we launch."; msg.classList.add('ok');
    } catch {
      msg.textContent = 'Something went wrong. Please try again.'; msg.classList.add('err');
    } finally { btn.disabled = false; btn.textContent = 'Notify Me'; }
  });
</script>
</body>
</html>
